<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoakedan - Test Site</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="font-bold text-xl tracking-wider text-indigo-400">Yoakedan</div>
            <nav class="text-sm text-slate-400">
                <span class="bg-indigo-950 text-indigo-300 px-3 py-1 rounded-full border border-indigo-800/50">Test Environment</span>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        <!-- Hero Section -->
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4 bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
                Yoakedan Test Platform
            </h1>
            <p class="text-slate-400 max-w-xl mx-auto text-base">
                このページはBase44からエクスポート・統合されたテスト用ウェブサイトです。お問い合わせフォームからの送信テストが行えます。
            </p>
        </div>

        <!-- Contact Section -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl max-w-xl mx-auto">
            <h2 class="text-2xl font-bold mb-2 text-slate-200">お問い合わせ</h2>
            <p class="text-sm text-slate-400 mb-6">ご質問やテストメッセージを入力してください。宛先（<span class="text-indigo-300 font-mono">info@yoakedan.com</span>）へ直接送信されます。</p>

            <form id="contactForm" class="space-y-5">
                <!-- 
                  【重要】Web3Formsのアクセスキーを設定してください。
                  https://web3forms.com/ から info@yoakedan.com 宛てにキーを無料で取得できます。
                -->
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                <input type="hidden" name="subject" value="【Yoakedan Test】新しいお問い合わせがありました">

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">お名前</label>
                    <input type="text" name="name" required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors"
                        placeholder="山田 太郎">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">メールアドレス</label>
                    <input type="email" name="email" required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors"
                        placeholder="example@domain.com">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1.5">メッセージ</label>
                    <textarea name="message" rows="4" required 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors resize-none"
                        placeholder="テストメッセージを入力..."></textarea>
                </div>

                <button type="submit" id="submitButton"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg transition-all shadow-lg shadow-indigo-600/20 active:scale-[0.99]">
                    送信する
                </button>

                <div id="formResult" class="text-center text-sm mt-3 hidden"></div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        &copy; 2026 Yoakedan Test. All rights reserved.
    </footer>

    <!-- JavaScript for Form Submission -->
    <script>
        const form = document.getElementById('contactForm');
        const submitButton = document.getElementById('submitButton');
        const formResult = document.getElementById('formResult');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // UIを送信中に変更
            submitButton.disabled = true;
            submitButton.textContent = "送信中...";
            formResult.classList.remove('hidden');
            formResult.textContent = "メッセージを送信しています...";
            formResult.className = "text-center text-sm mt-3 text-indigo-400";

            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            // Web3Forms APIへのリクエスト
            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let resJson = await response.json();
                if (response.status === 200) {
                    formResult.textContent = "お問い合わせが正常に送信されました！";
                    formResult.className = "text-center text-sm mt-3 text-emerald-400";
                    form.reset();
                } else {
                    console.error(resJson);
                    formResult.textContent = resJson.message || "送信に失敗しました。時間をおいて再度お試しください。";
                    formResult.className = "text-center text-sm mt-3 text-rose-400";
                }
            })
            .catch(error => {
                console.error(error);
                formResult.textContent = "ネットワークエラーが発生しました。接続を確認してください。";
                formResult.className = "text-center text-sm mt-3 text-rose-400";
            })
            .finally(() => {
                submitButton.disabled = false;
                submitButton.textContent = "送信する";
            });
        });
    </script>
</body>
</html>
