<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>夜明け団 Minecraft Server Manager</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel-2: #0f172a;
      --border: #1e293b;
      --border-light: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
      --warn: #eab308;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ログイン画面 */
    #login-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .login-card h1 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .login-card p {
      margin: 0 0 20px;
      font-size: 13px;
      color: var(--muted);
    }

    /* メイン画面 */
    #main-screen {
      display: none;
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 700;
    }

    .status-pill {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      background: #1e293b;
      color: var(--muted);
    }

    .status-pill.running {
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .status-pill.maintenance {
      background: rgba(234, 179, 8, 0.16);
      color: #fde047;
      border: 1px solid rgba(234, 179, 8, 0.35);
    }

    .user-area {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 920px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .card h2 {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label.field-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    select, input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .checkbox-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .checkbox-inline input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* 「サーバー種類」下の小さな Mod管理 リンク */
    .sub-link-wrap {
      margin-top: 5px;
      display: none;
    }

    .mod-manage-link {
      font-size: 12px;
      color: #60a5fa;
      text-decoration: underline;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }

    .mod-manage-link:hover {
      color: #93c5fd;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      padding: 9px 14px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-danger:hover:not(:disabled) {
      background: var(--danger-hover);
    }

    .btn-secondary {
      background: #334155;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #475569;
    }

    .btn-full {
      width: 100%;
      margin-top: 10px;
    }

    /* ターミナル */
    .terminal-box {
      background: #050811;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      height: 460px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .command-bar {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .error-text {
      color: #f87171;
      font-size: 12px;
      margin-top: 8px;
      min-height: 18px;
    }

    /* 監査ログ */
    .audit-section {
      margin-top: 18px;
    }

    .audit-list {
      max-height: 220px;
      overflow-y: auto;
      font-size: 12px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }

    .audit-item {
      padding: 5px 0;
      border-bottom: 1px solid #1e293b;
      color: var(--muted);
    }

    .audit-item:last-child {
      border-bottom: none;
    }

    .audit-item strong {
      color: var(--text);
    }

    /* モーダル */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--panel);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      max-height: 84vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .modal-subtitle {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
    }

    .modal-close {
      background: transparent;
      color: var(--muted);
      font-size: 20px;
      padding: 2px 8px;
    }

    .modal-close:hover {
      color: var(--text);
    }

    .mod-list-scroll {
      flex: 1;
      overflow-y: auto;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 14px;
    }

    .mod-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 6px;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
      cursor: pointer;
    }

    .mod-row:last-child {
      border-bottom: none;
    }

    .mod-name {
      word-break: break-all;
      flex: 1;
    }

    .mod-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .mod-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 5px;
      font-weight: 600;
      white-space: nowrap;
    }

    .mod-badge.enabled {
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
    }

    .mod-badge.disabled {
      background: rgba(148, 163, 184, 0.16);
      color: #cbd5e1;
    }

    .mod-checkbox {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .modal-status {
      font-size: 12px;
      color: var(--muted);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <!-- ログイン画面 -->
  <div id="login-screen">
    <form class="login-card" id="login-form">
      <h1>夜明け団 Server Manager</h1>
      <p>Minecraft サーバー管理パネルにログイン</p>
      <div class="form-group">
        <label class="field-label" for="login-email">メールアドレス</label>
        <input type="email" id="login-email" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label class="field-label" for="login-password">パスワード</label>
        <input type="password" id="login-password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn-primary btn-full" id="login-btn">ログイン</button>
      <div class="error-text" id="login-error"></div>
    </form>
  </div>

  <!-- メイン管理画面 -->
  <div id="main-screen">
    <header>
      <div class="brand">
        <span class="brand-title">夜明け団 Minecraft Server Manager</span>
        <span class="status-pill" id="server-status-pill">停止中</span>
      </div>
      <div class="user-area">
        <span id="current-user-label"></span>
        <button type="button" class="btn-secondary" id="open-pw-modal-btn">パスワード変更</button>
        <button type="button" class="btn-secondary" id="logout-btn">ログアウト</button>
      </div>
    </header>

    <div class="grid">
      <!-- 左カラム: 起動コントロール -->
      <div class="card">
        <h2>サーバーコントロール</h2>

        <div class="form-group">
          <label class="field-label" for="server-type-select">サーバー種類</label>
          <select id="server-type-select">
            <option value="vanilla">Vanilla</option>
            <option value="mod">Mod</option>
          </select>
          <!-- 「サーバー種類」下の小さな Mod管理 リンク -->
          <div class="sub-link-wrap" id="mod-manage-link-wrap">
            <button type="button" class="mod-manage-link" id="open-mod-manager-link">Mod管理</button>
          </div>
        </div>

        <div class="form-group">
          <label class="field-label" for="version-select">バージョン</label>
          <select id="version-select"></select>
        </div>

        <div class="form-group">
          <label class="field-label" for="world-select">ワールド</label>
          <select id="world-select"></select>
        </div>

        <div class="form-group">
          <label class="checkbox-inline">
            <input type="checkbox" id="use-java8-checkbox" />
            <span>JDK 8 を使用する（未チェック時は JDK 25）</span>
          </label>
        </div>

        <div class="btn-row">
          <button type="button" class="btn-primary" id="start-server-btn">サーバー起動</button>
          <button type="button" class="btn-danger" id="stop-server-btn">サーバー停止</button>
        </div>

        <button type="button" class="btn-secondary btn-full" id="backup-now-btn">今すぐバックアップ</button>
        <div class="error-text" id="control-message"></div>
      </div>

      <!-- 右カラム: リアルタイムコンソール -->
      <div class="card">
        <h2>コンソール / ログ</h2>
        <div class="terminal-box" id="terminal-box"></div>
        <form class="command-bar" id="command-form">
          <input type="text" id="command-input" placeholder="サーバーコマンドを入力（例: list, save-all, op ユーザー名）" />
          <button type="submit" class="btn-primary" id="send-command-btn">送信</button>
        </form>
      </div>
    </div>

    <!-- 監査ログ -->
    <div class="card audit-section">
      <h2>直近の操作ログ（監査ログ）</h2>
      <div class="audit-list" id="audit-list">読み込み中...</div>
    </div>
  </div>

  <!-- Mod管理モーダル -->
  <div class="modal-backdrop" id="mod-manager-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3>Mod管理</h3>
          <div class="modal-subtitle" id="mod-manager-subtitle"></div>
        </div>
        <button type="button" class="modal-close" id="close-mod-manager-btn" aria-label="閉じる">×</button>
      </div>

      <div class="mod-list-scroll" id="mod-file-list"></div>

      <div class="modal-footer">
        <span class="modal-status" id="mod-status-message"></span>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancel-mod-manager-btn">閉じる</button>
          <button type="button" class="btn-primary" id="apply-mods-btn">適用</button>
        </div>
      </div>
    </div>
  </div>

  <!-- パスワード変更モーダル -->
  <div class="modal-backdrop" id="pw-modal">
    <div class="modal-card" style="max-width: 420px;">
      <div class="modal-header">
        <div>
          <h3>パスワード変更</h3>
          <div class="modal-subtitle">8文字以上・英大文字・英小文字・記号を各1文字以上含めてください</div>
        </div>
        <button type="button" class="modal-close" id="close-pw-modal-btn" aria-label="閉じる">×</button>
      </div>
      <form id="pw-form">
        <div class="form-group">
          <label class="field-label" for="new-password-input">新しいパスワード</label>
          <input type="password" id="new-password-input" required />
        </div>
        <div class="error-text" id="pw-error"></div>
        <div class="modal-actions" style="justify-content: flex-end; margin-top: 12px;">
          <button type="button" class="btn-secondary" id="cancel-pw-modal-btn">キャンセル</button>
          <button type="submit" class="btn-primary">変更する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (() => {
      const API_BASE = "https://api.yoakedan.com";
      const WS_BASE = "wss://api.yoakedan.com";

      let authToken = localStorage.getItem("yoakedan_token") || "";
      let currentUser = null;
      let optionsCache = null;
      let ws = null;

      // DOM参照
      const loginScreen = document.getElementById("login-screen");
      const mainScreen = document.getElementById("main-screen");
      const loginForm = document.getElementById("login-form");
      const loginEmail = document.getElementById("login-email");
      const loginPassword = document.getElementById("login-password");
      const loginError = document.getElementById("login-error");

      const currentUserLabel = document.getElementById("current-user-label");
      const serverStatusPill = document.getElementById("server-status-pill");
      const logoutBtn = document.getElementById("logout-btn");

      const serverTypeSelect = document.getElementById("server-type-select");
      const versionSelect = document.getElementById("version-select");
      const worldSelect = document.getElementById("world-select");
      const useJava8Checkbox = document.getElementById("use-java8-checkbox");

      const modLinkWrap = document.getElementById("mod-manage-link-wrap");
      const openModLink = document.getElementById("open-mod-manager-link");
      const modModal = document.getElementById("mod-manager-modal");
      const modSubtitle = document.getElementById("mod-manager-subtitle");
      const modFileList = document.getElementById("mod-file-list");
      const modStatusMessage = document.getElementById("mod-status-message");
      const applyModsBtn = document.getElementById("apply-mods-btn");
      const closeModModalBtn = document.getElementById("close-mod-manager-btn");
      const cancelModModalBtn = document.getElementById("cancel-mod-manager-btn");

      const startServerBtn = document.getElementById("start-server-btn");
      const stopServerBtn = document.getElementById("stop-server-btn");
      const backupNowBtn = document.getElementById("backup-now-btn");
      const controlMessage = document.getElementById("control-message");

      const terminalBox = document.getElementById("terminal-box");
      const commandForm = document.getElementById("command-form");
      const commandInput = document.getElementById("command-input");
      const auditList = document.getElementById("audit-list");

      const pwModal = document.getElementById("pw-modal");
      const openPwModalBtn = document.getElementById("open-pw-modal-btn");
      const closePwModalBtn = document.getElementById("close-pw-modal-btn");
      const cancelPwModalBtn = document.getElementById("cancel-pw-modal-btn");
      const pwForm = document.getElementById("pw-form");
      const newPasswordInput = document.getElementById("new-password-input");
      const pwError = document.getElementById("pw-error");

      function apiHeaders(isJson = true) {
        const headers = { "Authorization": `Bearer ${authToken}` };
        if (isJson) headers["Content-Type"] = "application/json";
        return headers;
      }

      function appendTerminalLine(text) {
        const atBottom = terminalBox.scrollTop + terminalBox.clientHeight >= terminalBox.scrollHeight - 24;
        terminalBox.textContent += (terminalBox.textContent ? "\n" : "") + text;
        if (atBottom) {
          terminalBox.scrollTop = terminalBox.scrollHeight;
        }
      }

      function updateModLinkVisibility() {
        modLinkWrap.style.display = serverTypeSelect.value === "mod" ? "block" : "none";
      }

      function populateSelect(selectEl, items, preferredValue) {
        selectEl.innerHTML = "";
        (items || []).forEach((item) => {
          const opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          selectEl.appendChild(opt);
        });
        if (preferredValue && (items || []).includes(preferredValue)) {
          selectEl.value = preferredValue;
        } else if ((items || []).length > 0) {
          selectEl.selectedIndex = 0;
        }
      }

      function refreshVersionAndWorldOptions(applyLastSelection = false) {
        if (!optionsCache) return;
        const type = serverTypeSelect.value;
        const last = applyLastSelection ? optionsCache.last_selection : null;

        populateSelect(
          versionSelect,
          optionsCache.versions[type] || [],
          last && last.server_type === type ? last.version : ""
        );
        populateSelect(
          worldSelect,
          optionsCache.worlds[type] || [],
          last && last.server_type === type ? last.world : ""
        );
        if (applyLastSelection && last) {
          useJava8Checkbox.checked = Boolean(last.use_java8);
        }
        updateModLinkVisibility();
      }

      function updateStatusUi(data) {
        if (data.maintenance_active) {
          serverStatusPill.textContent = "メンテナンス中";
          serverStatusPill.className = "status-pill maintenance";
        } else if (data.server_running) {
          const label = data.current_server_type ? data.current_server_type.toUpperCase() : "RUNNING";
          serverStatusPill.textContent = `稼働中 (${label})`;
          serverStatusPill.className = "status-pill running";
        } else {
          serverStatusPill.textContent = "停止中";
          serverStatusPill.className = "status-pill";
        }
      }

      async function loadOptions(applyLastSelection = false) {
        const res = await fetch(`${API_BASE}/api/options`, { headers: apiHeaders(false) });
        if (res.status === 401) {
          handleLogout();
          return;
        }
        optionsCache = await res.json();
        if (applyLastSelection && optionsCache.last_selection?.server_type) {
          serverTypeSelect.value = optionsCache.last_selection.server_type;
        }
        refreshVersionAndWorldOptions(applyLastSelection);
        updateStatusUi(optionsCache);
      }

      async function loadAuditLogs() {
        const res = await fetch(`${API_BASE}/api/audit-logs`, { headers: apiHeaders(false) });
        if (!res.ok) return;
        const logs = await res.json();
        if (!logs.length) {
          auditList.innerHTML = `<div class="audit-item">操作ログはありません。</div>`;
          return;
        }
        auditList.innerHTML = logs.map((l) =>
          `<div class="audit-item">[${escapeHtml(l.timestamp)}] <strong>${escapeHtml(l.action)}</strong> - ${escapeHtml(l.user_email)} ${l.details ? `(${escapeHtml(l.details)})` : ""}</div>`
        ).join("");
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function connectTerminalWebSocket() {
        if (ws) {
          ws.close();
          ws = null;
        }
        terminalBox.textContent = "";
        ws = new WebSocket(`${WS_BASE}/ws/terminal?token=${encodeURIComponent(authToken)}`);
        ws.onmessage = (event) => {
          appendTerminalLine(event.data);
          if (event.data.includes("サーバー起動をリクエスト") || event.data.includes("サーバープロセスが終了") || event.data.includes("定期メンテナンス")) {
            loadOptions(false);
            loadAuditLogs();
          }
        };
        ws.onclose = () => {
          setTimeout(() => {
            if (authToken && mainScreen.style.display !== "none") {
              connectTerminalWebSocket();
            }
          }, 3000);
        };
      }

      async function enterMainScreen(userInfo) {
        currentUser = userInfo;
        currentUserLabel.textContent = `${userInfo.username} (${userInfo.email})`;
        loginScreen.style.display = "none";
        mainScreen.style.display = "block";

        await loadOptions(true);
        await loadAuditLogs();
        connectTerminalWebSocket();

        if (userInfo.must_reset_password) {
          pwError.textContent = "初回ログインのため、パスワードを変更してください。";
          pwModal.classList.add("open");
        }
      }

      function handleLogout() {
        authToken = "";
        currentUser = null;
        localStorage.removeItem("yoakedan_token");
        localStorage.removeItem("yoakedan_user");
        if (ws) {
          ws.close();
          ws = null;
        }
        mainScreen.style.display = "none";
        loginScreen.style.display = "flex";
      }

      // ログイン処理
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        loginError.textContent = "";
        try {
          const res = await fetch(`${API_BASE}/api/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email: loginEmail.value.trim(),
              password: loginPassword.value
            })
          });
          const data = await res.json();
          if (!res.ok) {
            loginError.textContent = data.detail || "ログインに失敗しました。";
            return;
          }
          authToken = data.token;
          localStorage.setItem("yoakedan_token", authToken);
          localStorage.setItem("yoakedan_user", JSON.stringify(data));
          loginPassword.value = "";
          await enterMainScreen(data);
        } catch (err) {
          loginError.textContent = `通信エラー: ${err.message}`;
        }
      });

      logoutBtn.addEventListener("click", handleLogout);

      serverTypeSelect.addEventListener("change", () => {
        refreshVersionAndWorldOptions(false);
      });

      // サーバー起動
      startServerBtn.addEventListener("click", async () => {
        controlMessage.textContent = "";
        controlMessage.style.color = "#f87171";
        startServerBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/api/server/start`, {
            method: "POST",
            headers: apiHeaders(true),
            body: JSON.stringify({
              server_type: serverTypeSelect.value,
              version: versionSelect.value,
              world: worldSelect.value,
              use_java8: useJava8Checkbox.checked
            })
          });
          const data = await res.json();
          if (!res.ok) {
            controlMessage.textContent = data.detail || "起動に失敗しました。";
          } else {
            controlMessage.style.color = "#86efac";
            controlMessage.textContent = data.message || "起動処理を開始しました。";
            await loadOptions(false);
            await loadAuditLogs();
          }
        } catch (err) {
          controlMessage.textContent = `通信エラー: ${err.message}`;
        } finally {
          startServerBtn.disabled = false;
        }
      });

      // サーバー停止
      stopServerBtn.addEventListener("click", async () => {
        controlMessage.textContent = "";
        controlMessage.style.color = "#f87171";
        stopServerBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/api/server/stop`, {
            method: "POST",
            headers: apiHeaders(true)
          });
          const data = await res.json();
          if (!res.ok) {
            controlMessage.textContent = data.detail || "停止に失敗しました。";
          } else {
            controlMessage.style.color = "#86efac";
            controlMessage.textContent = data.message || "停止処理を実行しました。";
            await loadAuditLogs();
          }
        } catch (err) {
          controlMessage.textContent = `通信エラー: ${err.message}`;
        } finally {
          stopServerBtn.disabled = false;
        }
      });

      // 今すぐバックアップ
      backupNowBtn.addEventListener("click", async () => {
        controlMessage.textContent = "";
        controlMessage.style.color = "#f87171";
        backupNowBtn.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/api/backup/now`, {
            method: "POST",
            headers: apiHeaders(true)
          });
          const data = await res.json();
          if (!res.ok) {
            controlMessage.textContent = data.detail || "バックアップ開始に失敗しました。";
          } else {
            controlMessage.style.color = "#86efac";
            controlMessage.textContent = data.message || "バックアップを開始しました。";
            await loadAuditLogs();
          }
        } catch (err) {
          controlMessage.textContent = `通信エラー: ${err.message}`;
        } finally {
          backupNowBtn.disabled = false;
        }
      });

      // コンソールコマンド送信
      commandForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const cmd = commandInput.value.trim();
        if (!cmd) return;
        try {
          const res = await fetch(`${API_BASE}/api/server/command`, {
            method: "POST",
            headers: apiHeaders(true),
            body: JSON.stringify({ command: cmd })
          });
          const data = await res.json();
          if (!res.ok) {
            appendTerminalLine(`[ERROR] コマンド送信失敗: ${data.detail || "不明なエラー"}`);
          } else {
            commandInput.value = "";
            loadAuditLogs();
          }
        } catch (err) {
          appendTerminalLine(`[ERROR] 通信エラー: ${err.message}`);
        }
      });

      // ==========================================
      // Mod管理モーダル処理
      // ==========================================
      function makeModBadge(enabled) {
        const span = document.createElement("span");
        span.className = `mod-badge ${enabled ? "enabled" : "disabled"}`;
        span.textContent = enabled ? ".jar" : ".jar.bak";
        return span;
      }

      async function openModManager() {
        const ver = versionSelect.value;
        if (!ver) {
          alert("Modサーバーのバージョンを選択してください。");
          return;
        }
        modSubtitle.textContent = `対象: version/mod/${ver}/mods`;
        modStatusMessage.textContent = "";
        modFileList.innerHTML = `<div class="mod-row" style="color:#94a3b8;">読み込み中...</div>`;
        modModal.classList.add("open");

        try {
          const res = await fetch(`${API_BASE}/api/mods?version=${encodeURIComponent(ver)}`, {
            headers: apiHeaders(false)
          });
          const data = await res.json();
          if (!res.ok) {
            modFileList.innerHTML = `<div class="mod-row" style="color:#f87171;">${escapeHtml(data.detail || "読み込みに失敗しました。")}</div>`;
            return;
          }

          if (!data.files || data.files.length === 0) {
            modFileList.innerHTML = `<div class="mod-row" style="color:#94a3b8;">mods フォルダ内にファイルがありません。</div>`;
            return;
          }

          modFileList.innerHTML = "";
          data.files.forEach((f) => {
            const row = document.createElement("label");
            row.className = "mod-row";

            const nameEl = document.createElement("span");
            nameEl.className = "mod-name";
            nameEl.textContent = f.filename;

            const controlsEl = document.createElement("div");
            controlsEl.className = "mod-controls";

            const badgeEl = makeModBadge(Boolean(f.enabled));

            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.className = "mod-checkbox";
            cb.dataset.filename = f.filename;
            cb.checked = Boolean(f.enabled);

            cb.addEventListener("change", () => {
              const nextBadge = makeModBadge(cb.checked);
              controlsEl.replaceChild(nextBadge, controlsEl.firstChild);
            });

            controlsEl.appendChild(badgeEl);
            controlsEl.appendChild(cb);

            row.appendChild(nameEl);
            row.appendChild(controlsEl);
            modFileList.appendChild(row);
          });
        } catch (err) {
          modFileList.innerHTML = `<div class="mod-row" style="color:#f87171;">通信エラー: ${escapeHtml(err.message)}</div>`;
        }
      }

      async function applyMods() {
        const ver = versionSelect.value;
        const checkboxes = modFileList.querySelectorAll('input[type="checkbox"].mod-checkbox');
        const mods = Array.from(checkboxes).map((cb) => ({
          filename: cb.dataset.filename,
          enabled: cb.checked
        }));

        applyModsBtn.disabled = true;
        applyModsBtn.textContent = "適用中...";
        modStatusMessage.textContent = "";

        try {
          const res = await fetch(`${API_BASE}/api/mods/apply`, {
            method: "POST",
            headers: apiHeaders(true),
            body: JSON.stringify({ version: ver, mods })
          });
          const data = await res.json();
          if (!res.ok) {
            modStatusMessage.style.color = "#f87171";
            modStatusMessage.textContent = data.detail || "適用に失敗しました。";
          } else {
            await openModManager();
            await loadAuditLogs();
            modStatusMessage.style.color = "#86efac";
            modStatusMessage.textContent = data.changed && data.changed.length > 0
              ? `${data.changed.length} 件の拡張子を更新しました。`
              : "変更はありませんでした。";
          }
        } catch (err) {
          modStatusMessage.style.color = "#f87171";
          modStatusMessage.textContent = `通信エラー: ${err.message}`;
        } finally {
          applyModsBtn.disabled = false;
          applyModsBtn.textContent = "適用";
        }
      }

      function closeModManager() {
        modModal.classList.remove("open");
      }

      openModLink.addEventListener("click", openModManager);
      applyModsBtn.addEventListener("click", applyMods);
      closeModModalBtn.addEventListener("click", closeModManager);
      cancelModModalBtn.addEventListener("click", closeModManager);

      // ==========================================
      // パスワード変更モーダル処理
      // ==========================================
      openPwModalBtn.addEventListener("click", () => {
        pwError.textContent = "";
        newPasswordInput.value = "";
        pwModal.classList.add("open");
      });

      function closePwModal() {
        pwModal.classList.remove("open");
      }

      closePwModalBtn.addEventListener("click", closePwModal);
      cancelPwModalBtn.addEventListener("click", closePwModal);

      pwForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        pwError.textContent = "";
        try {
          const res = await fetch(`${API_BASE}/api/change-password`, {
            method: "POST",
            headers: apiHeaders(true),
            body: JSON.stringify({ new_password: newPasswordInput.value })
          });
          const data = await res.json();
          if (!res.ok) {
            pwError.textContent = data.detail || "変更に失敗しました。";
            return;
          }
          closePwModal();
          await loadAuditLogs();
          alert("パスワードを変更しました。");
        } catch (err) {
          pwError.textContent = `通信エラー: ${err.message}`;
        }
      });

      // 初期起動時のセッション復元
      if (authToken) {
        const savedUser = localStorage.getItem("yoakedan_user");
        const parsedUser = savedUser ? JSON.parse(savedUser) : { username: "User", email: "", must_reset_password: false };
        enterMainScreen(parsedUser).catch(() => handleLogout());
      }
    })();
  </script>
</body>
</html>
